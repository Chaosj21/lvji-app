apply plugin: 'com.android.library'

android {
    namespace 'com.amap.flutter.amap_flutter_location'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    dependencies {
        implementation 'com.amap.api:location:5.6.0'
    }
}
