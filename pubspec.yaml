name: lvji_app
description: A full-cycle travel companion app - plan, record, and journal your journey.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Database
  drift: ^2.13.0
  
  # HTTP Client
  flutter_secure_storage: ^11.0.0
  dio: ^5.3.0
  
  # Routing
  go_router: ^12.0.0
  
  # Map & Location
  amap_flutter_map: ^3.0.0
  amap_flutter_location: ^3.0.0

  # Note: amap_flutter_base is a transitive dependency of amap_flutter_map
  
  # UI
  cupertino_icons: ^1.0.0
  
  # Image Handling
  image_picker: ^1.0.0
  image: ^4.1.0
  
  # File & Export
  pdf: ^3.8.0
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  
  # Network Detection
  connectivity_plus: ^7.3.1
  
  # Logging
  logger: ^2.0.0
  
  # Localization
  intl: ^0.19.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  
  # JSON
  json_annotation: ^4.8.0
  
  # UUID
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.13.0
  json_serializable: ^6.7.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true

dependency_overrides:
  amap_flutter_base:
    path: packages/amap_flutter_base_override
  amap_flutter_map:
    path: packages/amap_flutter_map_override
  amap_flutter_location:
    path: packages/amap_flutter_location_override
  
  # assets:
  #   - assets/images/
  #   - assets/icons/
  
